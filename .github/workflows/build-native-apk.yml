          package dev.pages.edutechmindset

          import android.app.Service
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.IBinder
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.TextView

          class FloatingBubbleService : Service() __OB__
            private lateinit var windowManager: WindowManager
            private var bubbleView: View? = null

            override fun onBind(intent: Intent?): IBinder? = null

            override fun onCreate() __OB__
              super.onCreate()
              windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
              val type = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
              else
                @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE

              val params = WindowManager.LayoutParams(
                WindowManager.LayoutParams.WRAP_CONTENT,
                WindowManager.LayoutParams.WRAP_CONTENT,
                type,
                WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                PixelFormat.TRANSLUCENT
              ).apply __OB__
                gravity = Gravity.TOP or Gravity.START
                x = 40
                y = 220
              __CB__

              val container = LinearLayout(this).apply __OB__
                orientation = LinearLayout.HORIZONTAL
                setPadding(24, 16, 24, 16)
                setBackgroundColor(Color.parseColor("#1E3A8A"))
              __CB__
              val titleBtn = TextView(this).apply __OB__
                text = "AI المساعد"
                setTextColor(Color.WHITE)
                textSize = 14f
                setPadding(8, 4, 16, 4)
              __CB__
              val closeBtn = TextView(this).apply __OB__
                text = "X"
                setTextColor(Color.parseColor("#FCA5A5"))
                textSize = 15f
                setPadding(12, 4, 8, 4)
                setOnClickListener __OB__ stopSelf() __CB__
              __CB__
              container.addView(titleBtn)
              container.addView(closeBtn)

              var initX = 0; var initY = 0; var touchX = 0f; var touchY = 0f
              titleBtn.setOnTouchListener __OB__ _, event ->
                when (event.action) __OB__
                  MotionEvent.ACTION_DOWN -> __OB__
                    initX = params.x; initY = params.y
                    touchX = event.rawX; touchY = event.rawY
                    true
                  __CB__
                  MotionEvent.ACTION_MOVE -> __OB__
                    params.x = initX + (event.rawX - touchX).toInt()
                    params.y = initY + (event.rawY - touchY).toInt()
                    windowManager.updateViewLayout(container, params)
                    true
                  __CB__
                  MotionEvent.ACTION_UP -> __OB__
                    if (kotlin.math.abs(event.rawX - touchX) < 12 && kotlin.math.abs(event.rawY - touchY) < 12) __OB__
                      val launch = Intent(this, MainActivity::class.java).apply __OB__
                        addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                      __CB__
                      startActivity(launch)
                    __CB__
                    true
                  __CB__
                  else -> false
                __CB__
              __CB__

              bubbleView = container
              windowManager.addView(container, params)
            __CB__

            override fun onDestroy() __OB__
              super.onDestroy()
              bubbleView?.let __OB__ windowManager.removeView(it) __CB__
            __CB__
          __CB__
