          keytool -genkeypair -v -keystore edutech-release.jks -alias edutech -keyalg RSA -keysize 2048 -validity 10000 -storepass edutech2026 -keypass edutech2026 -dname "CN=Basel Al-Faqawi, OU=EduTech Mindset, O=EduTech Mindset, L=Gaza, S=Palestine, C=PS"
