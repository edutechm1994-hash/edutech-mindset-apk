          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          suspend fun askEduTechAi(prompt: String): String = withContext(Dispatchers.IO) __OB__
            try __OB__
              val endpoint = "https://" + "edutech-mindset.pages.dev" + "/api/ai"
              val url = URL(endpoint)
              val conn = (url.openConnection() as HttpURLConnection).apply __OB__
                requestMethod = "POST"
                connectTimeout = 15000
                readTimeout = 20000
                doOutput = true
                setRequestProperty("Content-Type", "application/json; charset=UTF-8")
              __CB__
              val payload = JSONObject().put("prompt", prompt).put("message", prompt).toString()
              conn.outputStream.use __OB__ it.write(payload.toByteArray(Charsets.UTF_8)) __CB__
              val code = conn.responseCode
              val stream = if (code in 200..299) conn.inputStream else conn.errorStream
              val raw = stream?.bufferedReader(Charsets.UTF_8)?.use __OB__ it.readText() __CB__ ?: ""
              try __OB__
                val json = JSONObject(raw)
                json.optString("reply").ifEmpty __OB__
                  json.optString("answer").ifEmpty __OB__
                    json.optString("response").ifEmpty __OB__
                      json.optString("message").ifEmpty __OB__ raw __CB__
                    __CB__
                  __CB__
                __CB__
              __CB__ catch (_: Exception) __OB__
                raw.ifEmpty __OB__ "تم استلام الرد (HTTP $code)" __CB__
              __CB__
            __CB__ catch (e: Exception) __OB__
              "تعذر الاتصال بواجهة الذكاء الاصطناعي: $__OB__e.localizedMessage ?: "خطأ في الشبكة"__CB__"
            __CB__
