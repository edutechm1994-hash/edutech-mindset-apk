name: Build Ultimate Android APK v4.0.0

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-ultimate-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses and Setup SDK 34
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Download EduTech Mindset Platform Files and Official Logo
        run: |
          mkdir -p app/src/main/assets/www/css app/src/main/assets/www/js app/src/main/assets/www/assets
          mkdir -p app/src/main/res/drawable app/src/main/res/mipmap-xxxhdpi app/src/main/res/values app/src/main/res/xml
           if [ -f "EduTech_Mindset_Cloudflare_Pages_153.zip" ]; then
            echo "Extracting EduTech_Mindset_Cloudflare_Pages_153.zip..."
            unzip -o EduTech_Mindset_Cloudflare_Pages_153.zip -d app/src/main/assets/www
            if [ ! -f "app/src/main/assets/www/index.html" ]; then SUB=$(find app/src/main/assets/www -maxdepth 2 -name "index.html" -print -quit); if [ -n "$SUB" ]; then cp -r "$(dirname "$SUB")"/* app/src/main/assets/www/; fi; fi
          fi
           node -e '
          const fs = require("fs");
          const path = require("path");
          const https = require("https");
          const BASE = "https://edutech-mindset.pages.dev";
          const WWW = "app/src/main/assets/www";
          https.globalAgent = new https.Agent({ keepAlive: false });

          function fetchBuf(url) {
            return new Promise((resolve, reject) => {
              https.get(url, (res) => {
                if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                  return fetchBuf(new URL(res.headers.location, url).toString()).then(resolve).catch(reject);
                }
                if (res.statusCode !== 200) return reject(new Error("HTTP " + res.statusCode + " " + url));
                const chunks = [];
                res.on("data", c => chunks.push(c));
                res.on("end", () => resolve(Buffer.concat(chunks)));
              }).on("error", reject);
            });
          }

          async function downloadRel(rel) {
            if (fs.existsSync("EduTech_Mindset_Cloudflare_Pages_153.zip")) return false;
            const clean = rel.replace(/^\/+/, "").split("?")[0].split("#")[0];
            if (!clean || clean.startsWith("http") || clean.includes("..")) return false;
            const dest = path.join(WWW, clean);
            fs.mkdirSync(path.dirname(dest), { recursive: true });
            try {
              const buf = await fetchBuf(BASE + "/" + clean);
              fs.writeFileSync(dest, buf);
              console.log("Downloaded:", clean, buf.length);
              return true;
            } catch (e) {
              console.log("Skipped:", clean, e.message);
              return false;
            }
          }

          (async () => {
            const core = [
              "index.html", "privacy.html", "manifest.json", "sw.js", "firebase-config.js",
              "css/style.css", "css/premium.css", "css/shell175.css",
              "assets/logo.png", "assets/icon-192.png", "assets/icon-512.png",
              "assets/icon-maskable-512.png", "assets/feature-banner.png"
            ];
            for (const f of core) await downloadRel(f);

            const discovered = new Set();
            for (const srcFile of ["index.html", "sw.js", "manifest.json"]) {
              const p = path.join(WWW, srcFile);
              if (!fs.existsSync(p)) continue;
              const txt = fs.readFileSync(p, "utf8");
              const re = /["'\''`]((?:\.\/|\/)?(?:js|css|assets|tools|data|modules)\/[a-zA-Z0-9_\-\/\.]+\.(?:js|css|png|jpg|jpeg|svg|webp|json|html|woff2?))["'\''`]/g;
              let m;
              while ((m = re.exec(txt)) !== null) {
                discovered.add(m[1].replace(/^\.\//, "").replace(/^\//, ""));
              }
            }
            for (const f of discovered) {
              if (!core.includes(f)) await downloadRel(f);
            }

            const logoSrc = fs.existsSync(path.join(WWW, "assets/icon-512.png"))
              ? path.join(WWW, "assets/icon-512.png")
              : path.join(WWW, "assets/logo.png");
            if (fs.existsSync(logoSrc)) {
              fs.copyFileSync(logoSrc, "app/src/main/res/drawable/official_logo.png");
              fs.copyFileSync(logoSrc, "app/src/main/res/mipmap-xxxhdpi/ic_launcher.png");
              fs.copyFileSync(logoSrc, "app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png");
            }
            process.exit(0);
          })();
          '

      - name: Create Gradle Project and AndroidManifest
        run: |
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "EduTechMindsetUltimate"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.edutech.mindset.ultimate"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.edutech.mindset.ultimate"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 400
                  versionName = "4.0.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
              androidResources {
                  noCompress += listOf("html", "js", "css", "json", "png", "svg", "webp")
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("androidx.activity:activity-compose:1.9.1")
              implementation("androidx.compose.ui:ui:1.6.8")
              implementation("androidx.compose.ui:ui-graphics:1.6.8")
              implementation("androidx.compose.foundation:foundation:1.6.8")
              implementation("androidx.compose.material3:material3:1.2.1")
              implementation("androidx.compose.material:material-icons-extended:1.6.8")
              implementation("androidx.webkit:webkit:1.11.0")
              implementation("com.google.android.gms:play-services-auth:21.2.0")
          }
          EOF

          touch app/proguard-rules.pro

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">EduTech Mindset Ultimate</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.EduTechUltimate" parent="android:Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">#060D1F</item>
                  <item name="android:navigationBarColor">#060D1F</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <paths>
              <cache-path name="camera_images" path="." />
              <external-files-path name="ext_images" path="." />
          </paths>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.GET_ACCOUNTS" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.EduTechUltimate"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".FloatingAssistantService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="floating_ai_assistant" />
                  </service>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

      - name: Create SQLite Helper and Floating Assistant Service
        run: |
          mkdir -p app/src/main/java/com/edutech/mindset/ultimate
          cat << 'EOF' > app/src/main/java/com/edutech/mindset/ultimate/EduTechDbHelper.kt
          package com.edutech.mindset.ultimate

          import android.content.ContentValues
          import android.content.Context
          import android.database.sqlite.SQLiteDatabase
          import android.database.sqlite.SQLiteOpenHelper

          class EduTechDbHelper(context: Context) :
              SQLiteOpenHelper(context, "edutech_mindset_ultimate.db", null, 2) {

              override fun onCreate(db: SQLiteDatabase) {
                  db.execSQL(
                      "CREATE TABLE IF NOT EXISTS assistant_messages (" +
                          "id INTEGER PRIMARY KEY AUTOINCREMENT, " +
                          "role TEXT NOT NULL, " +
                          "content TEXT NOT NULL, " +
                          "timestamp INTEGER NOT NULL)"
                  )
                  db.execSQL(
                      "CREATE TABLE IF NOT EXISTS user_notes (" +
                          "id INTEGER PRIMARY KEY AUTOINCREMENT, " +
                          "title TEXT NOT NULL, " +
                          "body TEXT NOT NULL, " +
                          "created_at INTEGER NOT NULL)"
                  )
                  db.execSQL(
                      "CREATE TABLE IF NOT EXISTS user_profile (" +
                          "id INTEGER PRIMARY KEY, " +
                          "email TEXT NOT NULL, " +
                          "display_name TEXT NOT NULL, " +
                          "updated_at INTEGER NOT NULL)"
                  )
                  db.execSQL("CREATE TABLE IF NOT EXISTS user_files (id INTEGER PRIMARY KEY AUTOINCREMENT, user_email TEXT NOT NULL, file_name TEXT NOT NULL, file_type TEXT NOT NULL, local_path TEXT NOT NULL, extracted_text TEXT NOT NULL, created_at INTEGER NOT NULL)")
                            }

              override fun onUpgrade(db: SQLiteDatabase, oldVersion: Int, newVersion: Int) {
                  onCreate(db)
              }

              fun saveMessage(role: String, content: String) {
                  val cv = ContentValues().apply {
                      put("role", role)
                      put("content", content)
                      put("timestamp", System.currentTimeMillis())
                  }
                  writableDatabase.insert("assistant_messages", null, cv)
              }

              fun getRecentMessages(limit: Int = 30): List<Pair<String, String>> {
                  val list = mutableListOf<Pair<String, String>>()
                  val cursor = readableDatabase.rawQuery(
                      "SELECT role, content FROM assistant_messages ORDER BY id DESC LIMIT ?",
                      arrayOf(limit.toString())
                  )
                  cursor.use {
                      while (it.moveToNext()) {
                          list.add(it.getString(0) to it.getString(1))
                      }
                  }
                  return list.reversed()
              }

              fun clearMessages() {
                  writableDatabase.delete("assistant_messages", null, null)
              }

              fun saveNote(title: String, body: String) {
                  val cv = ContentValues().apply {
                      put("title", title)
                      put("body", body)
                      put("created_at", System.currentTimeMillis())
                  }
                  writableDatabase.insert("user_notes", null, cv)
              }

              fun getNotesCount(): Int {
                  val cursor = readableDatabase.rawQuery("SELECT COUNT(*) FROM user_notes", null)
                  cursor.use {
                      return if (it.moveToFirst()) it.getInt(0) else 0
                  }
              }

              fun saveGoogleUser(email: String, name: String) {
                  val cv = ContentValues().apply {
                      put("id", 1)
                      put("email", email)
                      put("display_name", name)
                      put("updated_at", System.currentTimeMillis())
                  }
                  writableDatabase.insertWithOnConflict("user_profile", null, cv, SQLiteDatabase.CONFLICT_REPLACE)
              }

              fun getGoogleUser(): Pair<String, String>? {
                  val cursor = readableDatabase.rawQuery(
                      "SELECT email, display_name FROM user_profile WHERE id = 1", null
                  )
                  cursor.use {
                      if (it.moveToFirst()) {
                          return it.getString(0) to it.getString(1)
                      }
                  }
                  return null
            fun insertUserFile(userEmail: String, fileName: String, fileType: String, localPath: String, extractedText: String): Long {
            val cv = ContentValues().apply {
            put("user_email", userEmail)
            put("file_name", fileName)
            put("file_type", fileType)
            put("local_path", localPath)
            put("extracted_text", extractedText)
            put("created_at", System.currentTimeMillis())
            }
            return writableDatabase.insert("user_files", null, cv)
            }
            
            fun getUserFiles(userEmail: String): List<UserFileItem> {
            val list = mutableListOf<UserFileItem>()
            val cursor = readableDatabase.rawQuery("SELECT id, user_email, file_name, file_type, local_path, extracted_text, created_at FROM user_files WHERE user_email = ? ORDER BY created_at DESC", arrayOf(userEmail))
            cursor.use {
            while (it.moveToNext()) {
            list.add(UserFileItem(it.getLong(0), it.getString(1), it.getString(2), it.getString(3), it.getString(4), it.getString(5), it.getLong(6)))
            }
            }
            return list
            }
            
            fun deleteUserFile(id: Long) {
            writableDatabase.delete("user_files", "id = ?", arrayOf(id.toString()))
            }
            data class UserFileItem(val id: Long, val userEmail: String, val fileName: String, val fileType: String, val localPath: String, val extractedText: String, val createdAt: Long)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/edutech/mindset/ultimate/FloatingAssistantService.kt
          package com.edutech.mindset.ultimate

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.IBinder
          import android.provider.Settings
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import androidx.core.app.NotificationCompat
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.io.OutputStreamWriter
          import java.net.HttpURLConnection
          import java.net.URL
          import kotlin.concurrent.thread
          import kotlin.math.abs

          class FloatingAssistantService : Service() {

              private lateinit var windowManager: WindowManager
              private lateinit var dbHelper: EduTechDbHelper
              private var orbView: View? = null
              private var panelView: View? = null
              private var chatContainer: LinearLayout? = null
              private var chatScroll: ScrollView? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  dbHelper = EduTechDbHelper(this)
                  startForegroundNotification()
                  if (Settings.canDrawOverlays(this)) {
                      showFloatingOrb()
                  }
              }

              private fun startForegroundNotification() {
                  val channelId = "edutech_assistant_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId,
                          "EduTech Smart Assistant",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val nm = getSystemService(NotificationManager::class.java)
                      nm.createNotificationChannel(channel)
                  }
                  val openIntent = Intent(this, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP
                  }
                  val pi = PendingIntent.getActivity(
                      this, 0, openIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("المساعد الذكي EduTech Mindset")
                      .setContentText("الزر العائم نشط وجاهز للمساعدة فوق التطبيقات")
                      .setSmallIcon(R.mipmap.ic_launcher)
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .build()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                      startForeground(1001, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(1001, notification)
                  }
              }

              private fun overlayType(): Int {
                  return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }
              }

              private fun showFloatingOrb() {
                  if (orbView != null) return
                  val density = resources.displayMetrics.density
                  val sizePx = (62 * density).toInt()

                  val container = FrameLayout(this).apply {
                      background = GradientDrawable(
                          GradientDrawable.Orientation.TL_BR,
                          intArrayOf(Color.parseColor("#0A1628"), Color.parseColor("#D4AF37"))
                      ).apply {
                          shape = GradientDrawable.OVAL
                          setStroke((2.5f * density).toInt(), Color.parseColor("#F5D061"))
                      }
                      elevation = 12 * density
                  }

                  val icon = ImageView(this).apply {
                      setImageResource(R.drawable.official_logo)
                      scaleType = ImageView.ScaleType.CENTER_CROP
                      val pad = (8 * density).toInt()
                      setPadding(pad, pad, pad, pad)
                  }
                  container.addView(icon, FrameLayout.LayoutParams(sizePx, sizePx))

                  val params = WindowManager.LayoutParams(
                      sizePx, sizePx,
                      overlayType(),
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 30
                      y = 300
                  }

                  var initialX = 0
                  var initialY = 0
                  var touchX = 0f
                  var touchY = 0f
                  var moved = false

                  container.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initialX = params.x
                              initialY = params.y
                              touchX = event.rawX
                              touchY = event.rawY
                              moved = false
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (event.rawX - touchX).toInt()
                              val dy = (event.rawY - touchY).toInt()
                              if (abs(dx) > 8 || abs(dy) > 8) moved = true
                              params.x = initialX + dx
                              params.y = initialY + dy
                              windowManager.updateViewLayout(container, params)
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!moved) toggleAssistantPanel()
                              true
                          }
                          else -> false
                      }
                  }

                  orbView = container
                  windowManager.addView(container, params)
              }

              private fun toggleAssistantPanel() {
                  if (panelView != null) {
                      closeAssistantPanel()
                      return
                  }
                  val density = resources.displayMetrics.density
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding((14 * density).toInt(), (14 * density).toInt(), (14 * density).toInt(), (14 * density).toInt())
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#F50A1628"))
                          cornerRadius = 20 * density
                          setStroke((2 * density).toInt(), Color.parseColor("#D4AF37"))
                      }
                  }

                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val title = TextView(this).apply {
                      text = "المساعد الذكي — EduTech Mindset"
                      setTextColor(Color.parseColor("#F5D061"))
                      textSize = 16f
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  val closeBtn = Button(this).apply {
                      text = "✕"
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#1E3A5F"))
                      setOnClickListener { closeAssistantPanel() }
                  }
                  header.addView(title)
                  header.addView(closeBtn)
                  root.addView(header)

                  val scroll = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          (240 * density).toInt()
                      ).apply {
                          topMargin = (8 * density).toInt()
                          bottomMargin = (8 * density).toInt()
                      }
                  }
                  val chatBox = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }
                  scroll.addView(chatBox)
                  root.addView(scroll)
                  chatContainer = chatBox
                  chatScroll = scroll

                  refreshChatHistory()

                  val inputRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val input = EditText(this).apply {
                      hint = "اسأل المساعد الذكي أو احفظ ملاحظة..."
                      setHintTextColor(Color.parseColor("#94A3B8"))
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#132642"))
                      val p = (10 * density).toInt()
                      setPadding(p, p, p, p)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  val sendBtn = Button(this).apply {
                      text = "إرسال"
                      setTextColor(Color.parseColor("#060D1F"))
                      setBackgroundColor(Color.parseColor("#D4AF37"))
                      setOnClickListener {
                          val q = input.text.toString().trim()
                          if (q.isNotEmpty()) {
                              input.setText("")
                              handleUserQuery(q)
                          }
                      }
                  }
                  inputRow.addView(input)
                  inputRow.addView(sendBtn)
                  root.addView(inputRow)

                  val footerRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = (8 * density).toInt() }
                  }
                  val openAppBtn = Button(this).apply {
                      text = "فتح المنصة"
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#1E3A5F"))
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply {
                          marginEnd = (6 * density).toInt()
                      }
                      setOnClickListener {
                          closeAssistantPanel()
                          val i = Intent(this@FloatingAssistantService, MainActivity::class.java).apply {
                              flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP
                          }
                          startActivity(i)
                      }
                  }
                  val clearBtn = Button(this).apply {
                      text = "مسح السجل"
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#3B1D2A"))
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      setOnClickListener {
                          dbHelper.clearMessages()
                          refreshChatHistory()
                      }
                  }
                  footerRow.addView(openAppBtn)
                  footerRow.addView(clearBtn)
                  root.addView(footerRow)

                  val width = (resources.displayMetrics.widthPixels * 0.90).toInt()
                  val params = WindowManager.LayoutParams(
                      width,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      overlayType(),
                      WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.CENTER
                  }
                  panelView = root
                  windowManager.addView(root, params)
              }

              private fun refreshChatHistory() {
                  val box = chatContainer ?: return
                  box.removeAllViews()
                  val messages = dbHelper.getRecentMessages(30)
                  if (messages.isEmpty()) {
                      addBubble(box, "assistant", "أهلاً بك! أنا المساعد الذكي لمنصة EduTech Mindset (42 أداة تعليمية). اسألني عن أي أداة أو اكتب ملاحظة لحفظها في قاعدة البيانات المحلية.")
                  } else {
                      messages.forEach { (role, content) -> addBubble(box, role, content) }
                  }
                  chatScroll?.post { chatScroll?.fullScroll(View.FOCUS_DOWN) }
              }

              private fun addBubble(box: LinearLayout, role: String, text: String) {
                  val density = resources.displayMetrics.density
                  val tv = TextView(this).apply {
                      this.text = if (role == "user") "أنت: $text" else "المساعد: $text"
                      setTextColor(if (role == "user") Color.parseColor("#F5D061") else Color.WHITE)
                      textSize = 14f
                      val p = (8 * density).toInt()
                      setPadding(p, p, p, p)
                      setBackgroundColor(if (role == "user") Color.parseColor("#162B4D") else Color.parseColor("#0F2240"))
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { bottomMargin = (6 * density).toInt() }
                  }
                  box.addView(tv)
              }

              private fun handleUserQuery(query: String) {
                  dbHelper.saveMessage("user", query)
                  refreshChatHistory()
                  thread {
                      val reply = queryAiOrLocal(query)
                      dbHelper.saveMessage("assistant", reply)
                      chatContainer?.post { refreshChatHistory() }
                  }
              }

              private fun queryAiOrLocal(query: String): String {
                  if (query.startsWith("ملاحظة:") || query.startsWith("احفظ:")) {
                      dbHelper.saveNote("ملاحظة سريعة", query)
                      val count = dbHelper.getNotesCount()
                      return "تم حفظ الملاحظة في قاعدة بيانات SQLite المحلية بنجاح (إجمالي الملاحظات: $count)."
                  }
                  try {
                      val endpoint = "https://edutech-mindset.pages.dev" + "/api/ai"
                      val url = URL(endpoint)
                      val conn = (url.openConnection() as HttpURLConnection).apply {
                          requestMethod = "POST"
                          connectTimeout = 4000
                          readTimeout = 6000
                          doOutput = true
                          setRequestProperty("Content-Type", "application/json")
                      }
                      val payload = JSONObject().put("prompt", query).toString()
                      OutputStreamWriter(conn.outputStream).use { it.write(payload) }
                      if (conn.responseCode in 200..299) {
                          val body = BufferedReader(InputStreamReader(conn.inputStream)).readText()
                          val json = JSONObject(body)
                          val ans = json.optString("reply", json.optString("response", ""))
                          if (ans.isNotBlank()) return ans
                      }
                  } catch (_: Exception) {
                  }
                  val user = dbHelper.getGoogleUser()?.second ?: "المستخدم"
                  return "مرحباً $user! تم تسجيل استفسارك محلياً في SQLite. تضم منصة EduTech Mindset 42 أداة ذكية للتعليم والتكنولوجيا بإدارة الأستاذ باسل الفقعاوي (تحضير الدروس، الاختبارات التفاعلية، المساعد البحثي، وأدوات الذكاء الاصطناعي). يمكنك فتح المنصة مباشرة للوصول للأداة المطلوبة."
              }

              private fun closeAssistantPanel() {
                  panelView?.let {
                      try { windowManager.removeView(it) } catch (_: Exception) {}
                  }
                  panelView = null
                  chatContainer = null
                  chatScroll = null
              }

              override fun onDestroy() {
                  super.onDestroy()
                  closeAssistantPanel()
                  orbView?.let {
                      try { windowManager.removeView(it) } catch (_: Exception) {}
                  }
                  orbView = null
              }
          }
