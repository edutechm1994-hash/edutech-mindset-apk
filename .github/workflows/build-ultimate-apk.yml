              @Composable
              private fun LuxuryMotionSplashScreen(onSkip: () -> Unit) {
                  val infinite = rememberInfiniteTransition(label = "splash")
                  val angle by infinite.animateFloat(
                      initialValue = 0f,
                      targetValue = 360f,
                      animationSpec = infiniteRepeatable(tween(6000, easing = LinearEasing), RepeatMode.Restart),
                      label = "angle"
                  )
                  val tilt by infinite.animateFloat(
                      initialValue = -25f,
                      targetValue = 25f,
                      animationSpec = infiniteRepeatable(tween(3000, easing = LinearEasing), RepeatMode.Reverse),
                      label = "tilt"
                  )
                  val pulse by infinite.animateFloat(
                      initialValue = 0.94f,
                      targetValue = 1.06f,
                      animationSpec = infiniteRepeatable(tween(1400, easing = LinearEasing), RepeatMode.Reverse),
                      label = "pulse"
                  )

                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(
                              Brush.radialGradient(
                                  colors = listOf(Color(0xFF13294B), Color(0xFF0A1628), Color(0xFF040914))
                              )
                          ),
                      contentAlignment = Alignment.Center
                  ) {
                      Canvas(modifier = Modifier.fillMaxSize()) {
                          val count = 36
                          for (i in 0 until count) {
                              val rad = Math.toRadians((angle + i * (360f / count)).toDouble())
                              val rx = (size.width * 0.42f) * ((i % 3 + 1) / 3f)
                              val ry = (size.height * 0.35f) * ((i % 4 + 1) / 4f)
                              val px = center.x + (rx * cos(rad)).toFloat()
                              val py = center.y + (ry * sin(rad)).toFloat()
