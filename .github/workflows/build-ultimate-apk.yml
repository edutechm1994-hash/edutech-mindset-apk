Count.toString(), color = Color.White); Button(onClick = { if (pageIdx < pageCount - 1) pageIdx++ }, enabled = pageIdx < pageCount - 1) { Text("الصفحة التالية") } } } else { androidx.compose.foundation.lazy.LazyColumn(modifier = Modifier.weight(1f)) { item { Text(textContent.ifBlank { "لا يوجد نص" }, color = Color.White) } } } } } }; fun extractDocxText(file: java.io.File): String { return try { val sb = StringBuilder(); ZipInputStream(java.io.FileInputStream(file)).use { zip -> var e = zip.nextEntry; while (e != null) { if (e.name == "word/document.xml") { val p = XmlPullParserFactory.newInstance().newPullParser(); p.setInput(zip, "UTF-8"); var ev = p.eventType; while (ev != XmlPullParser.END_DOCUMENT) { if (ev == XmlPullParser.START_TAG && (p.name == "t" || p.name == "w:t")) sb.append(p.nextText()) else if (ev == XmlPullParser.END_TAG && (p.name == "p" || p.name == "w:p")) sb.append("\n"); ev = p.next() }; break }; e = zip.nextEntry } }; sb.toString() } catch (e: Exception) { e.message ?: "" } }; fun renderPdfPage(file: java.io.File, pageIndex: Int): Pair<Bitmap?, Int> { return try { ParcelFileDescriptor.open(file, ParcelFileDescriptor.MODE_READ_ONLY).use { pfd -> PdfRenderer(pfd).use { r -> val cnt = r.pageCount; if (cnt <= 0) return null to 0; val idx = pageIndex.coerceIn(0, cnt - 1); r.openPage(idx).use { page -> val bmp = Bitmap.createBitmap(page.width * 2, page.height * 2, Bitmap.Config.ARGB_8888); Canvas(bmp).drawColor(android.graphics.Color.WHITE); page.render(bmp, null, null, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY); bmp to cnt } } } } catch (e: Exception) { null to 0 } }

              @SuppressLint("SetJavaScriptEnabled")
              @Composable
              private fun PlatformWebView() {
                  val context = this
                  val assetLoader = remember {
                      WebViewAssetLoader.Builder()
                          .setDomain("edutech-mindset.pages.dev")
                          .addPathHandler("/", WebViewAssetLoader.PathHandler { path ->
                              val clean = path.trimStart('/').ifEmpty { "index.html" }
                              try {
                                  val stream = context.assets.open("www/$clean")
                                  val mime = when {
                                      clean.endsWith(".html", true) -> "text/html"
                                      clean.endsWith(".js", true) -> "application/javascript"
                                      clean.endsWith(".css", true) -> "text/css"
                                      clean.endsWith(".json", true) -> "application/json"
                                      clean.endsWith(".svg", true) -> "image/svg+xml"
                                      clean.endsWith(".png", true) -> "image/png"
                                      clean.endsWith(".jpg", true) || clean.endsWith(".jpeg", true) -> "image/jpeg"
                                      clean.endsWith(".webp", true) -> "image/webp"
                                      clean.endsWith(".woff2", true) -> "font/woff2"
                                      else -> URLConnection.guessContentTypeFromName(clean) ?: "application/octet-stream"
                                  }
                                  WebResourceResponse(mime, "UTF-8", stream)
                              } catch (_: Exception) {
                                  null
                              }
                          })
                          .build()
                  }

                  AndroidView(
                      modifier = Modifier.fillMaxSize(),
                      factory = { ctx ->
                          WebView(ctx).apply {
                              webViewRef = this
                              CookieManager.getInstance().setAcceptCookie(true)
                              CookieManager.getInstance().setAcceptThirdPartyCookies(this, true)
                              settings.apply {
                                  javaScriptEnabled = true
                                  domStorageEnabled = true
                                  databaseEnabled = true
                                  allowFileAccess = true
                                  mediaPlaybackRequiresUserGesture = false
                                  mixedContentMode = WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                                  cacheMode = if (isOnline(ctx)) WebSettings.LOAD_DEFAULT else WebSettings.LOAD_CACHE_ELSE_NETWORK
                              }
                              addJavascriptInterface(NativeJsBridge(), "EduTechNativeBridge")
 addJavascriptInterface(NativeJsBridge(), "AndroidNativeBridge")
                              webViewClient = object : WebViewClient() {
                                  override fun shouldInterceptRequest(
                                      view: WebView,
                                      request: WebResourceRequest
                                  ): WebResourceResponse? {
                                      if (request.url.path?.startsWith("/api/") == true) return null
                                      return assetLoader.shouldInterceptRequest(request.url)
                                  }

                                  override fun shouldOverrideUrlLoading(
                                      view: WebView,
                                      request: WebResourceRequest
                                  ): Boolean {
                                      return false
                                  }

                                  override fun onPageFinished(view: WebView?, url: String?) {
                                      view?.evaluateJavascript("(function(){try{var s=document.getElementById('edutech-hide-offbar');if(!s){s=document.createElement('style');s.id='edutech-hide-offbar';s.textContent='#offBar{display:none!important;}';document.head.appendChild(s);}document.querySelectorAll('#offBar').forEach(function(e){e.style.display='none';});}catch(e){}if(!window.__edutechFetchPatched&&window.AndroidNativeBridge){window.__edutechFetchPatched=true;var orig=window.fetch.bind(window);window.fetch=function(input,init){try{var u=typeof input==='string'?input:(input&&input.url?input.url:'');var m=(init&&init.method?init.method:'GET').toUpperCase();var idx=u.indexOf('/api/');if(idx!==-1&&m==='POST'){var p=u.substring(idx);var b=(init&&init.body)?String(init.body):'{}';var r=JSON.parse(window.AndroidNativeBridge.httpPost(p,b));return Promise.resolve(new Response(r.body||'{}',{status:r.status||200,headers:{'Content-Type':'application/json'}}));}}catch(e){}return orig(input,init);};}})();", null)
                                      super.onPageFinished(view, url)
                                      val email = googleEmailState.value
                                      val name = googleNameState.value
                                      if (!email.isNullOrBlank()) {
                                          injectGoogleUserIntoWebView(email, name ?: email)
                                      }
                                  }
                              }
                              webChromeClient = object : WebChromeClient() {
                                  override fun onPermissionRequest(request: PermissionRequest) {
                                      request.grant(request.resources)
                                  }

                                  override fun onShowFileChooser(
                                      webView: WebView?,
                                      filePathCallback: ValueCallback<Array<Uri>>?,
                                      fileChooserParams: FileChooserParams?
                                  ): Boolean {
                                      this@MainActivity.filePathCallback?.onReceiveValue(null)
                                      this@MainActivity.filePathCallback = filePathCallback
                                      val takePictureIntent = Intent(MediaStore.ACTION_IMAGE_CAPTURE).apply {
                                          val photoFile = File(cacheDir, "cam_${System.currentTimeMillis()}.jpg")
                                          val uri = FileProvider.getUriForFile(
                                              ctx, "${ctx.packageName}.fileprovider", photoFile
                                          )
                                          cameraImageUri = uri
                                          putExtra(MediaStore.EXTRA_OUTPUT, uri)
                                      }
                                      val contentIntent = Intent(Intent.ACTION_GET_CONTENT).apply {
                                          addCategory(Intent.CATEGORY_OPENABLE)
                                          type = "*/*"
                                          putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                                      }
                                      val chooser = Intent(Intent.ACTION_CHOOSER).apply {
                                          putExtra(Intent.EXTRA_INTENT, contentIntent)
                                          putExtra(Intent.EXTRA_INITIAL_INTENTS, arrayOf(takePictureIntent))
                                      }
                                      fileChooserLauncher.launch(chooser)
                                      return true
                                  }
                              }
                              loadUrl("https://edutech-mindset.pages.dev/")
                          }
                      }
                  )
              }

              private fun isOnline(ctx: Context): Boolean {
                  val cm = ctx.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                  val net = cm.activeNetwork ?: return false
                  val caps = cm.getNetworkCapabilities(net) ?: return false
                  return caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
              }

              inner class NativeJsBridge {
                  @JavascriptInterface fun httpPost(path: String, body: String): String { return try { val u = if (path.startsWith("http")) path else "https://edutech-mindset.pages.dev" + (if (path.startsWith("/")) path else "/" + path); val c = (java.net.URL(u).openConnection() as HttpURLConnection).apply { requestMethod = "POST"; doOutput = true; connectTimeout = 15000; readTimeout = 30000; setRequestProperty("Content-Type", "application/json"); setRequestProperty("Origin", "https://edutech-mindset.pages.dev"); setRequestProperty("Referer", "https://edutech-mindset.pages.dev/") }; c.outputStream.use { it.write(body.toByteArray(Charsets.UTF_8)) }; val code = c.responseCode; val s = if (code in 200..299) c.inputStream else c.errorStream; val txt = s?.bufferedReader()?.use { it.readText() } ?: "{}"; JSONObject().put("status", code).put("body", txt).toString() } catch (e: Exception) { JSONObject().put("status", 500).put("error", e.message ?: "error").toString() } }
                  @JavascriptInterface
                  fun getNativeGoogleUser(): String {
                      val u = dbHelper.getGoogleUser() ?: return "{}"
                      return JSONObject().put("email", u.first).put("name", u.second).toString()
                  }

                  @JavascriptInterface
                  fun requestGoogleSignIn() {
                      runOnUiThread { launchGoogleSignIn() }
                  }

                  @JavascriptInterface
                  fun startVoiceRecognition() {
                      runOnUiThread { this@MainActivity.startVoiceRecognition() }
                  }

                  @JavascriptInterface
                  fun toggleFloatingAssistant() {
                      runOnUiThread { startFloatingAssistant() }
                  }

                  @JavascriptInterface
                  fun saveNoteToDb(title: String, body: String) {
                      dbHelper.saveNote(title, body)
                  }
              }

