      - name: Build and Sign Release APK
        run: |
          gradle assembleRelease --no-daemon
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias edutech \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass EduTech2026! -keypass EduTech2026! \
            -dname "CN=EduTech Mindset, OU=Education, O=EduTech, L=Gaza, C=PS"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -n 1)
          "$ZIPALIGN" -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-aligned.apk
          "$APKSIGNER" sign --ks release.jks --ks-pass pass:EduTech2026! --key-pass pass:EduTech2026! --out EduTech-Mindset-Pro-v4.0.apk app-aligned.apk
          "$APKSIGNER" verify --print-certs EduTech-Mindset-Pro-v4.0.apk | tee cert_info.txt
          APK_SIZE=$(ls -lh EduTech-Mindset-Pro-v4.0.apk | awk '{print $5}')
          APK_BYTES=$(stat -c%s EduTech-Mindset-Pro-v4.0.apk)
          APK_SHA1=$(sha1sum EduTech-Mindset-Pro-v4.0.apk | awk '{print $1}')
          CERT_SHA1=$(grep -i "SHA-1 digest" cert_info.txt | head -n 1 | awk -F': ' '{print $2}')
          echo "APK_SIZE=$APK_SIZE ($APK_BYTES bytes)" | tee -a "$GITHUB_ENV"
          echo "APK_SHA1=$APK_SHA1" | tee -a "$GITHUB_ENV"
          echo "CERT_SHA1=$CERT_SHA1" | tee -a "$GITHUB_ENV"

      - name: Create Release v4.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.0
          name: EduTech Mindset Ultimate v4.0.0
          body: |
            الإصدار الشامل v4.0.0 من تطبيق EduTech Mindset (Kotlin + Jetpack Compose)
            - تضمين منصة EduTech Mindset الكاملة (42 أداة) عبر WebViewAssetLoader للعمل أونلاين وأوفلاين
            - شاشة موشن جرافيك فاخرة بالشعار الرسمي وحلقات ثلاثية الأبعاد وترحيب صوتي عربي
            - تسجيل الدخول بحساب Google، الكاميرا، الصور، الميكروفون (SpeechRecognizer)، الإشعارات، والمساعد الذكي العائم مع قاعدة بيانات SQLite محلية

            **حجم الملف:** ${{ env.APK_SIZE }}
            **بصمة SHA-1 للملف:** ${{ env.APK_SHA1 }}
            **بصمة SHA-1 لشهادة التوقيع:** ${{ env.CERT_SHA1 }}
          files: EduTech-Mindset-Pro-v4.0.apk
